<!doctype html>
<!-- Paleta y modo de partida en el propio <html>: los tokens de color viven en
     `[data-palette]`, no en `:root`, así que sin esto el primer pintado se haría
     sin ninguno hasta que React monta y ThemeProvider los fija. -->
<html lang="es" data-palette="papel" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agentopsy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
