id: case-win-006
description: "Volcado RAM Windows 10 con conexión C2 anómala: puerto no estándar desde proceso sospechoso"
os_profile: windows
evidence_fixture: fixtures/win10-c2-netscan.mem   # memdump sintético, no incluido en git

expected_findings:
  - title_glob: "*conexión*anómala*|*C2*|*netscan*|*puerto*no estándar*"
    severity: high
    provenance_tool: volatility3      # windows.netscan.NetScan -> ESTABLISHED a IP externa desde un PID sin binario firmado en disco

expected_mitre:
