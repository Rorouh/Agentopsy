# Caso de evaluación sintético para el harness comparativo local-vs-cloud.
# Formato propuesto en docs/agentes/diseno-fase2.md §9.4.
# NUNCA contiene evidencia real con datos personales: la fixture es sintética.
id: case-win-004
description: "Imagen Windows 10 con ejecución de cmd.exe y reconocimiento: Amcache/AppCompatCache + 4688"
os_profile: windows
evidence_fixture: fixtures/win10-exec-recon.raw   # generada por el equipo, no incluida en git

expected_findings:
  - title_glob: "*ejecución*binario*|*Amcache*|*AppCompatCache*primera ejecución*"
    severity: medium
    provenance_tool: regripper        # Amcache.hve / AppCompatCache -> primera ejecución (plugins amcache/appcompatcache)
  - title_glob: "*4688*|*creación de proceso*cmd*|*reconocimiento*proceso*"
    severity: medium
    provenance_tool: evtxecmd         # Security.evtx 4688 -> cmd.exe + utilidades de descubrimiento (whoami, net, systeminfo)

expected_mitre:
  - technique_id: T1059.003          # Command and Scripting Interpreter: Windows Command Shell
  - technique_id: T1057              # Process Discovery

budget:
  max_iterations: 12
  max_tokens: 200000

# Correlación "Ejecución confirmada" (playbook): Amcache/AppCompatCache (regripper)
# + 4688 del mismo binario (evtxecmd). El recon es la cadena de 4688 con whoami/net/
# systeminfo (T1057). Prefetch corrobora vía timeline; sin tool dedicada en allowlist.
