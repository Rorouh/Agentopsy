# Registro de MOTORES pluggables para el harness single-shot (run_eval.py).
#
# Un "motor" es cualquier CLI o modelo capaz de recibir un prompt en modo NO
# interactivo y devolver texto por stdout. El harness es AGNÓSTICO del motor:
# añadir uno nuevo es SOLO añadir un bloque aquí — cero cambios de código.
#
# Esquema de cada motor:
#   ready:          bool. Si es false, run_eval.py falla en seco al seleccionarlo
#                   (RULE 2: no se ejecuta un motor no verificado en esta máquina;
#                   se marca ready:true cuando se ha cableado y probado de verdad).
#   argv:           lista de argumentos (subprocess con shell=False SIEMPRE).
#                   Tokens sustituibles:
#                     {model}       -> el modelo resuelto (--model o default_model)
#                     {prompt}      -> el prompt (solo si prompt_via: arg)
#                     {prompt_file} -> ruta a un tmp con el prompt (solo prompt_via: file)
#   prompt_via:     cómo llega el prompt al proceso:
#                     stdin -> se escribe en la entrada estándar del proceso
#                     arg   -> se sustituye {prompt} dentro de argv
#                     file  -> se escribe a un fichero temporal y se sustituye {prompt_file}
#   default_model:  modelo por defecto si no se pasa --model (opcional).
#   note:           comentario libre (por qué ready:false, versión a ajustar, etc.).
#
# NUNCA se usa shell=True ni cadenas de comando: argv en lista, siempre.
motors:

  # --- MOTORES VERIFICADOS EN ESTA MÁQUINA (ejecutados de verdad) -------------

  ollama:
    # Loop local sin egreso (motor privado por defecto del producto, GDPR).
    # El prompt entra por stdin; el modelo se fija en argv con {model}.
    ready: true
    argv: ["ollama", "run", "{model}"]
    prompt_via: stdin
    default_model: "qwen2.5:3b"

  ollama_arg:
    # Mismo engine, adapter DISTINTO: demuestra el camino prompt_via: arg con un
    # subprocess real (el prompt se sustituye en argv, no va por stdin).
    ready: true
    argv: ["ollama", "run", "{model}", "{prompt}"]
    prompt_via: arg
    default_model: "qwen2.5:3b"

  # --- MOTORES CLI CABLEADOS PERO NO DISPONIBLES AQUÍ (ready:false) -----------
  # Se dejan definidos para que activarlos sea SOLO poner ready:true cuando la
  # herramienta esté instalada y autenticada. El harness no cambia.

  claude:
    # Claude Code en modo print / no interactivo.
    ready: false
    argv: ["claude", "-p", "{prompt}"]
    prompt_via: arg
    note: "no instalado en esta máquina; poner ready:true tras verificar 'claude -p'."

  gemini:
    # ready:false VERAZ (RULE 2): la auth nunca se verificó en esta máquina
    # (plan-ruta: "bloqueado por errores de instalación/uso (tier/auth)") y las
    # 3 corridas de 2026-07-02 murieron en el lanzador sin una sola inferencia.
    # Además, prompt_via: arg es inviable con este CLI en Windows: el ejecutable
    # se resuelve al shim npm gemini.CMD (se lanza vía `cmd /c`) y el prompt del
    # agente (~27 KB) como argumento revienta el límite de 8191 caracteres de
    # cmd.exe ("La línea de comandos es demasiado larga", corrida 131610). El
    # prompt pasa a stdin (modo headless del CLI). Antes de poner ready:true:
    # verificar auth Y que `gemini --yolo -m <model>` lee el prompt por stdin.
    ready: false
    argv: ["gemini", "--yolo", "-m", "{model}"]
    prompt_via: stdin
    default_model: "gemini-3.1-pro"   # pro para calidad; flash si quieres velocidad

  codex:
    # Vía 1 (run_eval, decisión): codex emite {tool_id,params}, NO ejecuta tools.
    # `-` => prompt por stdin (help: "if `-` is used, instructions are read from stdin").
    # Evita el límite ~32K de CreateProcess con el prompt ensamblado (~33K).
    ready: true
    argv: ["codex", "exec", "-"]
    prompt_via: stdin
    note: "prompt por stdin (-). Sin bypass: en Vía 1 no debe ejecutar comandos."
    
  codex_auto:
    # Vía 2 (run_investigation --mode autonomous): codex SÍ ejecuta vol sobre una COPIA.
    # --skip-git-repo-check: el cwd es la carpeta de evidencia (fuera del repo git).
    # --dangerously-bypass-approvals-and-sandbox: sin él, `codex exec` sin TTY no
    #   aprueba el spawn de `vol` y da WinError 5. SOLO laboratorio, sobre COPIA;
    #   Volatility es read-only sobre memoria.
    ready: true
    argv: ["codex", "exec", "--skip-git-repo-check", "--dangerously-bypass-approvals-and-sandbox", "-"]
    prompt_via: stdin
    note: "modo autónomo de laboratorio; requiere COPIA de la evidencia (soundness)."