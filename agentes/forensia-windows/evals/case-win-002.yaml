# Caso de evaluación sintético para el harness comparativo local-vs-cloud.
# Formato propuesto en docs/agentes/diseno-fase2.md §9.4.
# NUNCA contiene evidencia real con datos personales: la fixture es sintética.
id: case-win-002
description: "Imagen Windows 10 con persistencia por servicio malicioso: clave Services + instalación 7045"
os_profile: windows
evidence_fixture: fixtures/win10-svc-persist.raw   # generada por el equipo, no incluida en git

expected_findings:
  - title_glob: "*servicio*persisten*|*Services*binario*|*servicio malicioso*"
    severity: high
    provenance_tool: regripper        # SYSTEM\CurrentControlSet\Services -> ImagePath anómalo (plugin services)
  - title_glob: "*7045*|*instalación de servicio*|*service install*"
    severity: medium
    provenance_tool: evtxecmd         # System.evtx event id 7045 (A new service was installed)

expected_mitre:
  - technique_id: T1543.003          # Create or Modify System Process: Windows Service

budget:
  max_iterations: 12
  max_tokens: 200000

# Correlación esperada: clave Services (regripper) + 7045 (evtxecmd) en la misma
# ventana => persistencia por servicio real, no ruido. Ver playbook, cadena
# "Persistencia confirmada" (variante servicio).
