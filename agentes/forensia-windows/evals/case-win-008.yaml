# Caso de evaluación sintético para el harness comparativo local-vs-cloud.
# Formato propuesto en docs/agentes/diseno-fase2.md §9.4.
# NUNCA contiene evidencia real con datos personales: la fixture es sintética.
id: case-win-008
description: "Imagen Windows 10 con volcado de credenciales: minidump de LSASS en disco + hive SAM accesible"
os_profile: windows
evidence_fixture: fixtures/win10-creddump.raw   # generada por el equipo, no incluida en git

expected_findings:
  - title_glob: "*minidump*lsass*|*volcado*LSASS*|*lsass*dmp*"
    severity: critical
    provenance_tool: yara             # lsass.DMP en %TEMP%/perfil (localizado con tsk_fls) -> regla YARA de minidump de credenciales
  - title_glob: "*SAM*|*hashes*cuentas locales*|*samparse*"
    severity: high
    provenance_tool: regripper        # hive SAM pre-extraído (tsk_icat) -> samparse (cuentas locales / hashes)

expected_mitre:
  - technique_id: T1003              # OS Credential Dumping
  - technique_id: T1003.001          # OS Credential Dumping: LSASS Memory

budget:
  max_iterations: 12
  max_tokens: 200000

# Disco: minidump de LSASS (tsk_fls -> yara) y hive SAM (tsk_icat -> regripper
# samparse). T1003.001 se sostiene por el minidump (seed: "minidumps"), no por RAM.
