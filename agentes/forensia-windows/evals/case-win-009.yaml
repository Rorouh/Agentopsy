# Caso de evaluación sintético para el harness comparativo local-vs-cloud.
# Formato propuesto en docs/agentes/diseno-fase2.md §9.4.
# NUNCA contiene evidencia real con datos personales: la fixture es sintética.
id: case-win-009
description: "Imagen Windows 10 con timestomping: $STANDARD_INFORMATION vs $FILE_NAME inconsistentes en el $MFT"
os_profile: windows
evidence_fixture: fixtures/win10-timestomp.raw   # generada por el equipo, no incluida en git

expected_findings:
  - title_glob: "*timestomp*|*SI vs FN*|*marcas de tiempo*inconsist*|*STANDARD_INFORMATION*FILE_NAME*"
    severity: high
    provenance_tool: mftecmd          # $MFT pre-extraído -> $SI anterior a $FN (o subsegundos en cero) = manipulación de timestamps

expected_mitre:
  - technique_id: T1070              # Indicator Removal (timestomp: sin sub-técnica en la seed -> técnica padre)
  - technique_id: T1036              # Masquerading (marcas falseadas para imitar ficheros del sistema)

budget:
  max_iterations: 12
  max_tokens: 200000

# mftecmd sobre el $MFT (tsk_icat): compara $SI y $FN. La incoherencia (o los
# subsegundos en cero) delata la manipulación. Cruza con tsk_mactime.
