# Caso de evaluación sintético para el harness comparativo local-vs-cloud.
# Formato propuesto en docs/agentes/diseno-fase2.md §9.4.
# NUNCA contiene evidencia real con datos personales: la fixture es sintética.
id: case-win-005
description: "Volcado RAM Windows 10 con inyección de código: regiones RWX en un proceso legítimo"
os_profile: windows
evidence_fixture: fixtures/win10-malfind.mem   # memdump sintético, no incluido en git

expected_findings:
  - title_glob: "*inyección*proceso*|*malfind*|*región RWX*|*process injection*"
    severity: critical
    provenance_tool: volatility3      # windows.malfind.Malfind -> páginas RWX/shellcode en un proceso confiable (p.ej. explorer.exe)

expected_mitre:
  - technique_id: T1055              # Process Injection

budget:
  max_iterations: 10
  max_tokens: 200000

# detected_kind = memory => sección B del playbook. No usar tsk_* / ewf_info (fallan
# sobre un memdump). Refuerza con windows.pslist/psscan para atar el PID afectado.
