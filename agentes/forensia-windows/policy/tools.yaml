# Allowlist de FORENSIA-WIN — subset del catálogo (forensia.toolkit.catalog)
# que ESTE agente puede invocar. El dispatcher rechaza cualquier tool_id fuera
# de esta lista aunque el modelo lo emita. Todos los ids:
#   (1) existen en el catálogo, y
#   (2) declaran el os_profile "windows".
# Si alguno no cumple, la carga del paquete falla en seco (CLAUDE.md RULE 2).
allowed:
  # --- Primer vistazo / probe diagnóstico (regla 9 / playbook §0) para kind unknown ---
  - file_info           # tipo de fichero real antes de invocar tools forenses
  - strings_head        # banners/marcadores (kernel Linux, EVTX, EnCase...) en unknown
  # --- Particiones / imagen ---
  - tsk_mmls            # tabla de particiones (no monta FS)
  - ewf_info            # metadatos del contenedor .E01
  # --- Sistema de ficheros + extracción quirúrgica (vía handle read-only) ---
  - tsk_fls             # árbol de ficheros incl. borrados (artefacto)
  - tsk_mactime         # bodyfile -> línea temporal MAC(b) (artefacto)
  - tsk_icat            # PRE-EXTRACCIÓN de $MFT / hives / EVTX para las tools container
  # --- Artefactos Windows (varias entregadas vía contenedor) ---
  - mftecmd            # $MFT -> CSV (timestomping)
  - regripper          # hives de registro -> persistencia, cuentas, USB...
  - evtxecmd           # EVTX -> CSV normalizado
  - hayabusa           # detecciones Sigma sobre EVTX
  - chainsaw           # detecciones Sigma / hunting sobre EVTX
  # --- IOCs / firmas ---
  - bulk_extractor      # emails, urls, ips, PII en no-asignado (artefacto)
  - yara                # reglas (malware, persistencia, webshell)
  # --- Memoria volátil ---
  - volatility3         # plugins windows.* (JSON)
  # --- Super-timeline (pesado, opcional) ---
  - plaso_log2timeline  # genera .plaso multi-fuente
  - plaso_psort         # filtra/exports la timeline de Plaso
  # --- Integridad / helpers para la IA ---
  - hashdeep            # hashing recursivo (verificación de artefactos)
  - jq                  # filtra JSON de Volatility/Hayabusa antes del LLM
