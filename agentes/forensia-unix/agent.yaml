# FORENSIA-UNIX — agente forense post-mortem para imágenes Linux/macOS.
# Paquete declarativo real (Fase 2). Sustituye a sample-unix.
# El loader (forensia.agent.loader) valida este manifiesto en seco al arrancar.
id: forensia-unix
name: "FORENSIA-UNIX · Analista forense post-mortem (Linux/macOS)"
version: "0.1.0"
os_profile: unix
authors:
  - "FORENSIA Team"

model:
  name: "llama3.1:8b"       # base local de la comparativa; cambiar aquí no toca prompts
  temperature: 0.2          # análisis determinista, poca creatividad
  max_iterations: 12        # tope de seguridad del loop tool-use. Bug 008: bajado
                            # de 18 → 12 (valor previo) — acota el peor caso de
                            # runaway; con la gestión de contexto nativa el coste
                            # por iteración ya cayó, así que 12 conserva cadenas de
                            # 4-6 tools por turno sin re-facturar 18 prefijos.

prompts:
  system: prompts/system.md
  identity: prompts/identity.md
  playbook: prompts/playbook.md

policy:
  tools: policy/tools.yaml
  redaction: policy/redaction.yaml

# Mapa de memoria híbrido: referencia consultada bajo demanda con
# `consultar_conocimiento(doc_id)`. La `description` viaja siempre en el índice del
# system prompt; el `content` solo cuando el agente lo pide (economía de contexto).
knowledge:
  - id: artefactos-unix
    title: "Artefactos UNIX/Linux/macOS — dónde mirar y con qué"
    description: "Catálogo de artefactos forenses (persistencia, cuentas, sesiones, ejecución, red, temporales, macOS) y la ruta/herramienta para cada uno."
    path: knowledge/artefactos-unix.md
