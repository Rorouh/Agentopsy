# Caso de evaluación sintético para el harness comparativo local-vs-cloud.
# Formato propuesto en docs/agentes/diseno-fase2.md §9.4.
# NUNCA contiene evidencia real con datos personales: la fixture es sintética.
id: case-unix-001
description: "Imagen Linux con webshell PHP en /var/www y persistencia vía cron"
os_profile: unix
evidence_fixture: fixtures/linux-webshell.raw   # generada por el equipo, no incluida en git

expected_findings:
  - title_glob: "*webshell*"
    severity: critical
    provenance_tool: yara          # detección por regla sobre /var/www extraído
  - title_glob: "*cron*persisten*"
    severity: high
    provenance_tool: tsk_icat      # /etc/cron.d/* recuperado del árbol de fls
  - title_glob: "*reverse shell*|*conexión saliente*"
    severity: high
    provenance_tool: bulk_extractor

expected_mitre:
  - technique_id: T1505.003        # Server Software Component: Web Shell
  - technique_id: T1053.003        # Scheduled Task/Job: Cron
  - technique_id: T1059.004        # Command and Scripting Interpreter: Unix Shell

budget:
  max_iterations: 12
  max_tokens: 200000

# Rúbrica mínima para report_quality (0-5): cita procedencia en cada hallazgo,
# distingue hecho de hipótesis, ancla a marcas de tiempo, sin afirmaciones sin
# artefacto. El detalle de la rúbrica vive en el harness (slice S6).
