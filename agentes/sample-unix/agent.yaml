# Sample UNIX agent — para desarrollo y demos.
# Reemplazado por el agente real cuando el equipo de entrenamiento entregue su carpeta.
id: sample-unix
name: "Sample Unix Analyst"
version: "0.1.0"
os_profile: unix
authors:
  - "FORENSIA Team"

model:
  backend: local
  name: "llama3.1:8b"
  temperature: 0.2
  max_iterations: 12

prompts:
  system: prompts/system.md
  identity: prompts/identity.md
  playbook: prompts/playbook.md

policy:
  tools: policy/tools.yaml
  redaction: policy/redaction.yaml
