# FORENSIA — nginx del servicio `web`: sirve la SPA y proxifica /api y /ws
# hacia el servicio `api` por la red interna del compose. Así la app es
# mismo-origen con su backend (sin CORS en el camino normal) y el navegador
# nunca necesita alcanzar api:8000 directamente.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta que no sea un fichero estático vuelve al index.
    location / {
        try_files $uri /index.html;
    }

    # Se reenvía el Host ORIGINAL del navegador (127.0.0.1:5173 / localhost:5173):
    # el backend mantiene su Host-header check anti DNS-rebinding de extremo a
    # extremo (allowlist FORENSIA_UI_ORIGINS del servicio api — SECURITY INVARIANT 2).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Un query al agente puede tardar minutos (el ejecutor corre un CLI con
        # timeout de 600 s): los timeouts del proxy deben superarlo.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        client_max_body_size 16m;
        # Streaming del progreso del agente (/api/agent/query/stream, NDJSON): sin
        # buffering, los eventos llegan al navegador según ocurren en vez de todos
        # al final. El backend además manda X-Accel-Buffering: no.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # Upgrade WebSocket cableado para cuando el api exponga /ws (streaming de
    # progreso del agente); hoy no hay endpoints /ws.
    location /ws {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 3600s;
    }
}
