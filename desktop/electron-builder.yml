appId: ai.forensia.desktop
productName: FORENSIA
directories:
  output: dist
  buildResources: build

files:
  - main.cjs
  - preload.cjs
  - renderer/dist/**

# RULE 1: everything the app uses ships inside the installer.
# `resources/forensia-sidecar` is the PyInstaller onedir (Volatility3/plaso inside it),
# copied here per OS/arch BEFORE electron-builder runs. `vendor/` holds native tools.
# `../agentes` is the trained-agent packages folder (see agentes/README.md); the
# sidecar reads it via FORENSIA_AGENTS_DIR which main.cjs sets to resourcesPath/agentes.
extraResources:
  - from: resources/forensia-sidecar
    to: forensia-sidecar
  - from: ../vendor
    to: vendor
  - from: resources/images
    to: images
  - from: ../agentes
    to: agentes

asarUnpack:
  - "resources/forensia-sidecar/**"
  - "vendor/**"
  - "resources/images/**"
  - "agentes/**"

# Code signing is deferred (see ARCHITECTURE.md §6). No Apple identity / Windows cert yet.
win:
  target: [nsis]
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target: [AppImage, deb]
  category: Utility
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  minimumSystemVersion: "11.0"
