[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forensia"
dynamic = ["version"]
description = "AI-assisted post-mortem digital forensics — desktop sidecar"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
]
# Forensic engines that ship INSIDE the PyInstaller sidecar (RULE 1).
# Pinned exact versions before the first packaged build.
forensics = [
    # "volatility3==...",
    # "plaso==...",
]
# Model backends. Cloud is OFF by default; these are optional extras.
models = [
    # "anthropic>=0.25",
    # "openai>=1.30",
    # "ollama>=0.2",
]

[tool.setuptools.dynamic]
version = { attr = "forensia._version.__version__" }

[tool.setuptools.packages.find]
include = ["forensia*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
