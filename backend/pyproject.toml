[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forensia"
dynamic = ["version"]
description = "AI-assisted post-mortem digital forensics — backend (servicio api del compose)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    # Cross-platform exclusive file lock for AuditLog.append (replaces fcntl.flock
    # so the audit chain stays coherent across processes on Win/macOS/Linux).
    "filelock>=3.13",
    # PDF real de los documentos del caso (forensia.reports.pdf). Pure-python: no
    # arrastra libs de sistema (a diferencia de weasyprint), así la imagen no crece.
    "fpdf2>=2.7.6",
    # Parseo de multipart/form-data: lo exige FastAPI para UploadFile (subida de
    # evidencia a la bandeja, /api/evidence/upload).
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",   # required by `asyncio_mode = "auto"` for MCP tests
    "httpx>=0.27",
    "ruff>=0.4",
]
# NOTE: the old [models] extra (openai SDK) is gone — the 2026-07-02 pivot
# replaced SDK backends with the executor layer (forensia/executors): the three
# CLIs live in the api image (docker/api/Dockerfile) and Ollama is plain HTTP
# via stdlib, so no Python dependency is needed. No API keys anywhere
# (SECURITY INVARIANT 7).
#
# Model Context Protocol — server SDK for `mcp-toolkit` (S1 of MCP_INVENTORY).
# Optional because the api runs without MCP for users who only use the
# web UI; the MCP server is opt-in for clients like Claude Desktop or the
# in-process integration in the ForensicAgent loop (S2).
mcp = [
    "mcp>=1.0,<2.0",
    "jsonref>=1.1",   # flatten $ref in Pydantic-derived JSON Schemas (D4)
]

[tool.setuptools.dynamic]
version = { attr = "forensia._version.__version__" }

[tool.setuptools.packages.find]
include = ["forensia*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100
