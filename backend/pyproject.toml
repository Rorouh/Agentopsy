[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forensia"
dynamic = ["version"]
description = "AI-assisted post-mortem digital forensics — desktop sidecar"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    # Cross-platform exclusive file lock for AuditLog.append (replaces fcntl.flock
    # so the audit chain stays coherent across processes on Win/macOS/Linux).
    "filelock>=3.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",   # required by `asyncio_mode = "auto"` for MCP tests
    "httpx>=0.27",
    "ruff>=0.4",
]
# Forensic engines that ship INSIDE the PyInstaller sidecar (RULE 1).
# Pinned exact versions before the first packaged build.
forensics = [
    # "volatility3==...",
    # "plaso==...",
]
# Model backends. Cloud is OFF by default; these are optional extras.
models = [
    # "anthropic>=0.25",
    "openai>=2.0",
    # "ollama>=0.2",
]
# Model Context Protocol — server SDK for `mcp-toolkit` (S1 of MCP_INVENTORY).
# Optional because the sidecar runs without MCP for users who only use the
# desktop UI; the MCP server is opt-in for clients like Claude Desktop or the
# in-process integration in the ForensicAgent loop (S2).
mcp = [
    "mcp>=1.0,<2.0",
    "jsonref>=1.1",   # flatten $ref in Pydantic-derived JSON Schemas (D4)
]

[tool.setuptools.dynamic]
version = { attr = "forensia._version.__version__" }

[tool.setuptools.packages.find]
include = ["forensia*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100
