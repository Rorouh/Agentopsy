name: ci

# CI del modelo compose: la app se entrega como `docker compose up --build`
# sobre contenedores Linux, así que el runtime es idéntico en los tres SO del
# host y basta validar en ubuntu (la antigua matriz de 3 SOs pertenecía al
# instalable nativo por plataforma, desmontado el 2026-07-02).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # [mcp] además de [dev]: tests/test_mcp_toolkit.py importa `mcp` a nivel
      # de módulo, así que sin el extra la colección de pytest falla — el gate
      # del servidor MCP forma parte de la suite, no es opcional en CI.
      - run: pip install -e ".[dev,mcp]"
      - name: Lint
        run: ruff check .
      - name: Tests + security gates
        run: pytest -q

  web:
    name: web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Type-check SPA
        run: npm run typecheck
      # `npm run build` repite el typecheck y compila con Vite — es el mismo
      # comando que ejecuta docker/web/Dockerfile, así que un Dockerfile roto
      # por tipos se detecta aquí sin construir la imagen.
      - name: Build SPA
        run: npm run build

  compose:
    name: compose (config + build api/web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config --quiet
      # Solo `api` y `web`, no se levanta ningún servicio. Los maletines
      # (toolkit-windows / toolkit-unix) quedan fuera a propósito: su build
      # instala el PPA GIFT + plaso/sleuthkit/bulk-extractor/libguestfs
      # (gigabytes de apt, decenas de minutos, y sujeto a la disponibilidad
      # del PPA) — demasiado lento y frágil para cada push. Sus Dockerfiles
      # se ejercitan en el flujo real (`docker compose up --build`); un job
      # aparte (programado) para construirlos queda anotado en
      # docs/operacion/proximos-pasos.md.
      - name: Build api + web images
        run: docker compose build api web
